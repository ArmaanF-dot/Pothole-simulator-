# Lane C (product) settings: prevention engine, what-if, triage, API.
# Move into config.yaml under `prevent:` at the next merge (config.yaml belongs to lane A).
# Every number marked ASSUMPTION is a hackathon placeholder, not a council figure.

paths:
  processed_dir: data/processed            # lane A
  lane_b_mock_dir: data/synthetic/mock_inputs
  synthetic_dir: data/synthetic            # lane B
  models_dir: data/models                  # lane B
  outputs_dir: outputs
  state_dir: outputs/lane_c                # API state: triage queue, work orders, outcomes, token log
  reports_dir: reports
  fms_csv: data/fms_roads_clean.csv        # real FixMyStreet road-surface reports (main)
  fms_all_csv: data/fms_dedup.csv          # includes pavement/footway reports (triage eval sample)

coverage:
  city: Southampton
  ons_code: E06000045
  bbox: [-1.48, 50.87, -1.33, 50.96]       # lon_min, lat_min, lon_max, lat_max; fallback when no ward polygons
  official_report_url: "https://www.southampton.gov.uk/travel-transport/roadworks/road-maintenance/"
  official_streetlight_url: "https://www.southampton.gov.uk/travel-transport/roadworks/road-maintenance/street-lighting"

urgency:
  w_p30: 0.7
  w_wear: 0.3
  consequence:                             # multiplied together, then capped
    a_road: 1.3
    bus_route: 1.2
    cycle_route: 1.1
    school_or_hospital_100m: 1.2
    cap: 1.5
  a_road_highways: [trunk, primary, trunk_link, primary_link]
  bands:                                   # lower bound inclusive
    critical: 90
    high: 70
    prevention: 40
    monitor: 0

treatments:                                # ASSUMPTION thresholds on wear (0-100)
  low_wear_max: 40
  high_wear_min: 75
  cost_per_m2:                             # ASSUMPTION placeholders, GBP
    crack_sealing: 3.0
    surface_dressing: 7.0
    patching: 45.0
    resurfacing: 30.0
  lane_width_m: {A: 7.3, BC: 6.5, residential: 5.5}
  patch_area_m2: 2.0                       # ASSUMPTION per planned repair visit
  hazard_multiplier: {crack_sealing: 0.6, surface_dressing: 0.6, patching: 0.8, resurfacing: 0.3}
  benefit_years: 2                         # spec: preventive treatment cuts hazard for 2 years
  label:
    crack_sealing: "Crack sealing"
    surface_dressing: "Surface dressing"
    patching: "Patch now, schedule resurfacing"
    resurfacing: "Schedule resurfacing"
    permanent_repair: "Permanent pothole repair"
    monitor: "Monitor"

costs:
  planned_repair: 56.94                    # ALARM 2025, average planned pothole repair
  reactive_repair: 87.80                   # ALARM 2025, average reactive pothole repair
  source: "ALARM 2025 (Asphalt Industry Alliance)"

plan:
  top_n: 50                                # rows in the weekly plan
  min_rise: 0.0                            # p30 must be forecast to rise by more than this
  max_forecast_age_h: 24                   # older forecast -> STALE, plan provisional

whatif:
  # Sensitivity surrogate used when lane B's risk model is not importable. Coefficients are the
  # published generator coefficients from the spec (not _truth.json). Load interaction gamma is an
  # ASSUMPTION: wet or frozen pavement fails faster under heavy axles.
  coef: {rain_30d_per_mm: 0.0125, freeze_thaw_14d: 0.4, rain_then_frost_7d: 0.8}
  load_gamma: 0.5
  esal_ref: 300
  weeks: [1, 2, 3]                          # forecast weeks perturbed (week 0 is observed weather)
  scenarios:
    # ASSUMPTION: deltas added to each perturbed week's weather features
    rain_then_frost: {rain_3d: 8, rain_7d: 15, rain_30d: 15, rain_90d: 15, hours_below_0_7d: 10, freeze_thaw_14d: 2, freeze_thaw_30d: 2, rain_then_frost_7d: 1}
    wet_week: {rain_3d: 15, rain_7d: 40, rain_30d: 40, rain_90d: 40}
    cold_snap: {hours_below_0_7d: 40, freeze_thaw_14d: 3, freeze_thaw_30d: 3}

feedback:                                  # crew outcome -> immediate re-score (until make retrain)
  pothole: confirmed                       # confirmed open pothole -> urgency 100
  cracking_p30_multiplier: 1.5
  none_p30_multiplier: 0.7

triage:
  model: gemini-2.5-flash                  # check the live model list before a live run
  max_turns: 6
  snap_radius_m: 30
  lamp_radius_m: 25
  duplicate_radius_m: 15
  duplicate_days: 14
  open_report_days: 120                    # "currently open" FixMyStreet layer: open and reported within this many days
  report_floor_band: high                  # proposed urgency for a pothole report before inspection

cost:                                      # ASSUMPTIONS for reports/cost.md
  price_per_mtok_usd: {input: 0.30, output: 2.50}   # Gemini 2.5 Flash paid tier; check ai.google.dev/pricing
  usd_to_gbp: 0.75
  officers: 4
  reports_per_month: 300                   # about 3,600 Southampton pothole repairs a year (FOI 2021-2025)
  plans_per_officer_per_month: 4.33
  hosting_gbp_per_month: 25                # one small VM for the API and static page
